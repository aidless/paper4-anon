# CI for paper4-anon
#
# This repository had no workflow, which is why a drift between
# evidence/evidence_manifest.json and the files it describes went unnoticed. The
# manifest records a sha256 and a size for 24 files; at the time this file was written
# 14 matched, 9 did not, and p4_prospective_collect.err was listed but absent. The
# repository has a single commit, so there is no earlier revision to compare against.
#
# The gate reports that drift rather than hiding it. Re-recording the manifest would
# overwrite a published result, which is not this workflow's call to make.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  evidence-chain:
    name: Evidence chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check every file the manifest describes
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path("evidence")
          manifest = json.loads((root / "evidence_manifest.json").read_text())
          files = manifest["files"]
          ok = mismatch = missing = 0
          for name, rec in sorted(files.items()):
              path = root / name
              if not path.exists():
                  print(f"MISSING {name}")
                  missing += 1
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest().upper()
              if digest != str(rec["sha256"]).upper():
                  print(f"MISMATCH {name}")
                  print(f"    manifest {rec['sha256']} ({rec['size']} bytes)")
                  print(f"    on disk   {digest} ({path.stat().st_size} bytes)")
                  mismatch += 1
              else:
                  ok += 1
          print(f"\n{ok}/{len(files)} match, {mismatch} differ, {missing} absent")
          sys.exit(1 if (mismatch or missing) else 0)
          PY

  parse:
    name: Recorded results parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Every recorded result is readable JSON
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          bad = []
          n = 0
          for path in sorted(pathlib.Path("evidence").rglob("*.json")):
              n += 1
              try:
                  json.loads(path.read_text())
              except Exception as exc:
                  print(f"UNPARSEABLE {path}: {type(exc).__name__}: {exc}")
                  bad.append(path)
          print(f"parsed {n - len(bad)}/{n}")
          sys.exit(1 if bad else 0)
          PY
      - name: External dependencies the manifest cannot resolve
        # input_manifest_20260806.json points at <ARCHIVE_ROOT> and <WORKSPACE>
        # paths that were never substituted, so those inputs cannot be checked from
        # inside this repository. Report them rather than pretending they passed.
        run: |
          python - <<'PY'
          import json
          import pathlib

          m = json.loads(pathlib.Path("evidence/input_manifest_20260806.json").read_text())
          unresolved = {k: v["path"] for k, v in m.items()
                        if v["path"].startswith("<")}
          print(f"{len(unresolved)}/{len(m)} inputs live outside this repository:")
          for name, path in sorted(unresolved.items()):
              print(f"  {name}: {path}")
          PY

  mutation-control:
    name: The evidence gate can fail
    runs-on: ubuntu-latest
    # Deliberately no `needs`. The first version depended on evidence-chain, which
    # means that whenever the gate is red — which is the normal state here — this job
    # was skipped and never demonstrated anything. A reverse control that only runs
    # when the thing it controls already passes is not a control.
    if: always()
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Corrupt one described file and require a non-zero exit
        run: |
          set -euo pipefail
          # heldout_validations_20260806.json is one of the fourteen files whose digest
          # currently matches the manifest, so corrupting it turns a passing check into
          # a failing one. Perturbing a file that already fails would prove nothing.
          cp evidence/heldout_validations_20260806.json /tmp/backup.json
          python - <<'PY'
          import json
          import pathlib
          p = pathlib.Path("evidence/heldout_validations_20260806.json")
          d = json.loads(p.read_text())
          # Change one recorded number rather than the formatting, so only the digest
          # check can catch it.
          def bump(o):
              if isinstance(o, dict):
                  for k, v in o.items():
                      if isinstance(v, bool):
                          continue
                      if isinstance(v, (int, float)):
                          o[k] = v + 0.001
                          return True
                      if bump(v):
                          return True
              elif isinstance(o, list):
                  for i, v in enumerate(o):
                      if isinstance(v, (int, float)) and not isinstance(v, bool):
                          o[i] = v + 0.001
                          return True
                      if bump(v):
                          return True
              return False
          if not bump(d):
              raise SystemExit("no numeric field to corrupt")
          p.write_text(json.dumps(d, indent=2))
          print("corrupted one recorded number in heldout_validations_20260806.json")
          PY
          if python - <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path("evidence")
          m = json.loads((root / "evidence_manifest.json").read_text())
          bad = 0
          for name, rec in m["files"].items():
              p = root / name
              if not p.exists():
                  bad += 1
              elif hashlib.sha256(p.read_bytes()).hexdigest().upper() != str(rec["sha256"]).upper():
                  bad += 1
          sys.exit(1 if bad else 0)
          PY
          then
            echo 'FAIL: the evidence gate accepted a corrupted file'
            exit 1
          fi
          echo 'OK: the evidence gate rejected the corrupted file'

  secret-scan:
    # Full history: a key leaked in an old commit is still a live key. The CLI is
    # used rather than gitleaks-action, which needs GITHUB_TOKEN to scan pull
    # requests and so turns every Dependabot PR red for an unrelated reason --
    # and a PR runs the workflow from its own branch, so a fix on main does not
    # take effect until the branch is regenerated. Pinned, not latest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --verbose
